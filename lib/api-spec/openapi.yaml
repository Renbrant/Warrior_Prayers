openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Warrior Prayers API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: dashboard
    description: Dashboard summary operations
  - name: groups
    description: Prayer group operations
  - name: invitations
    description: Invitation operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /users/me/language:
    patch:
      operationId: updateLanguage
      tags: [users]
      summary: Update user preferred language
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageUpdate"
      responses:
        "200":
          description: Language updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats for current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /groups:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: List all groups the current user belongs to
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new prayer group
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Group not found
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update group settings (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSettingsInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Group not found

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List all active members of a group
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/members/{memberId}:
    patch:
      operationId: updateGroupMember
      tags: [groups]
      summary: Update a member's role (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Member not found
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a member from a group (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Member not found

  /groups/{groupId}/invites:
    get:
      operationId: listGroupInvites
      tags: [invitations]
      summary: List all invites for a group (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupInvite"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
    post:
      operationId: createGroupInvite
      tags: [invitations]
      summary: Create a new invite (email or link) — admin only
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvite"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required

  /groups/{groupId}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      tags: [invitations]
      summary: Revoke a pending invite (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Invite not found

  /invitations/my:
    get:
      operationId: listMyInvitations
      tags: [invitations]
      summary: List pending invitations for the current user (by email)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyInvitation"
        "401":
          description: Unauthorized

  /invitations/{token}:
    get:
      operationId: getInviteByToken
      tags: [invitations]
      summary: Get invite details by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Invite not found or expired

  /invitations/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invitations]
      summary: Accept an invitation
      security:
        - clerkAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          description: Invite expired, revoked, or max uses reached
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

  /invitations/{token}/decline:
    post:
      operationId: declineInvite
      tags: [invitations]
      summary: Decline an invitation
      security:
        - clerkAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation declined
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        fullName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        churchName:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        preferredLanguage:
          type: string
          enum: [en, pt, es]
        primaryAuthProvider:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]
        isProfileComplete:
          type: boolean
      required:
        - id
        - clerkId
        - email
        - preferredLanguage
        - primaryAuthProvider
        - emailVerified
        - createdAt
        - updatedAt
        - isProfileComplete

    UserProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        churchName:
          type: string
        city:
          type: string
        profilePhotoUrl:
          type: string
        preferredLanguage:
          type: string
          enum: [en, pt, es]

    LanguageUpdate:
      type: object
      properties:
        language:
          type: string
          enum: [en, pt, es]
      required:
        - language

    DashboardSummary:
      type: object
      properties:
        groupCount:
          type: integer
        activeRequestCount:
          type: integer
        closedRequestCount:
          type: integer
        answeredPrayerCount:
          type: integer
        myCommittedRequestCount:
          type: integer
        pendingInvitationCount:
          type: integer
      required:
        - groupCount
        - activeRequestCount
        - closedRequestCount
        - answeredPrayerCount
        - myCommittedRequestCount
        - pendingInvitationCount

    GroupSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        churchName:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        verse:
          type: ["string", "null"]
        memberCount:
          type: integer
        myRole:
          type: string
          enum: [admin, moderator, member]
        createdAt:
          type: string
      required:
        - id
        - name
        - memberCount
        - myRole
        - createdAt

    GroupDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        churchName:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        verse:
          type: ["string", "null"]
        hidePrayerPersonNames:
          type: boolean
        allowCustomCategories:
          type: boolean
        allowComments:
          type: boolean
        allowAnonymousRequests:
          type: boolean
        adminsCanViewAnonymousAuthors:
          type: boolean
        memberCount:
          type: integer
        myRole:
          type: string
          enum: [admin, moderator, member]
        createdByUserId:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - hidePrayerPersonNames
        - allowCustomCategories
        - allowComments
        - allowAnonymousRequests
        - adminsCanViewAnonymousAuthors
        - memberCount
        - myRole
        - createdByUserId
        - createdAt
        - updatedAt

    GroupInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        churchName:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        verse:
          type: string
        hidePrayerPersonNames:
          type: boolean
        allowCustomCategories:
          type: boolean
        allowComments:
          type: boolean
        allowAnonymousRequests:
          type: boolean
        adminsCanViewAnonymousAuthors:
          type: boolean
      required:
        - name

    GroupSettingsInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        churchName:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        verse:
          type: string
        hidePrayerPersonNames:
          type: boolean
        allowCustomCategories:
          type: boolean
        allowComments:
          type: boolean
        allowAnonymousRequests:
          type: boolean
        adminsCanViewAnonymousAuthors:
          type: boolean

    GroupMemberDetail:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        groupId:
          type: string
        role:
          type: string
          enum: [admin, moderator, member]
        status:
          type: string
        joinedAt:
          type: string
        fullName:
          type: ["string", "null"]
        email:
          type: string
        profilePhotoUrl:
          type: ["string", "null"]
      required:
        - id
        - userId
        - groupId
        - role
        - status
        - joinedAt
        - email

    MemberRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [admin, moderator, member]
      required:
        - role

    GroupInvite:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        invitedEmail:
          type: ["string", "null"]
        token:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined, expired, revoked]
        expiresAt:
          type: ["string", "null"]
        maxUses:
          type: ["integer", "null"]
        usedCount:
          type: integer
        createdAt:
          type: string
        acceptedAt:
          type: ["string", "null"]
        revokedAt:
          type: ["string", "null"]
        inviteUrl:
          type: string
      required:
        - id
        - groupId
        - token
        - status
        - usedCount
        - createdAt
        - inviteUrl

    InviteInput:
      type: object
      properties:
        invitedEmail:
          type: string
          format: email
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
        maxUses:
          type: integer
          minimum: 1

    MyInvitation:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        groupId:
          type: string
        groupName:
          type: string
        groupDescription:
          type: ["string", "null"]
        invitedByName:
          type: ["string", "null"]
        invitedByEmail:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: ["string", "null"]
      required:
        - id
        - token
        - groupId
        - groupName
        - invitedByEmail
        - createdAt

    InvitePreview:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        groupId:
          type: string
        groupName:
          type: string
        groupDescription:
          type: ["string", "null"]
        invitedByName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, declined, expired, revoked]
        expiresAt:
          type: ["string", "null"]
        isExpired:
          type: boolean
      required:
        - id
        - token
        - groupId
        - groupName
        - status
        - isExpired
