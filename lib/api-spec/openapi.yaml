openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Warrior Prayers API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: dashboard
    description: Dashboard summary operations
  - name: groups
    description: Prayer group operations
  - name: invitations
    description: Invitation operations
  - name: categories
    description: Prayer category operations
  - name: prayers
    description: Prayer request operations
  - name: sessions
    description: Prayer session (Prayer Mode) operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /users/me/language:
    patch:
      operationId: updateLanguage
      tags: [users]
      summary: Update user preferred language
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageUpdate"
      responses:
        "200":
          description: Language updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats for current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /groups:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: List all groups the current user belongs to
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"
        "401":
          description: Unauthorized
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new prayer group
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          description: Validation error
        "401":
          description: Unauthorized

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group details
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Group not found
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update group settings (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupSettingsInput"
      responses:
        "200":
          description: Updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Group not found

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List all active members of a group
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMemberDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/members/{memberId}:
    patch:
      operationId: updateGroupMember
      tags: [groups]
      summary: Update a member's role (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Member not found
    delete:
      operationId: removeGroupMember
      tags: [groups]
      summary: Remove a member from a group (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: memberId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Member removed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Member not found

  /groups/{groupId}/invites:
    get:
      operationId: listGroupInvites
      tags: [invitations]
      summary: List all invites for a group (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupInvite"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
    post:
      operationId: createGroupInvite
      tags: [invitations]
      summary: Create a new invite (email or link) — admin only
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteInput"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupInvite"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required

  /groups/{groupId}/invites/{inviteId}:
    delete:
      operationId: revokeGroupInvite
      tags: [invitations]
      summary: Revoke a pending invite (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: inviteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invite revoked
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — admin role required
        "404":
          description: Invite not found

  /invitations/my:
    get:
      operationId: listMyInvitations
      tags: [invitations]
      summary: List pending invitations for the current user (by email)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MyInvitation"
        "401":
          description: Unauthorized

  /invitations/{token}:
    get:
      operationId: getInviteByToken
      tags: [invitations]
      summary: Get invite details by token (public)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Invite not found or expired

  /invitations/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [invitations]
      summary: Accept an invitation
      security:
        - clerkAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "400":
          description: Invite expired, revoked, or max uses reached
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

  /invitations/{token}/decline:
    post:
      operationId: declineInvite
      tags: [invitations]
      summary: Decline an invitation
      security:
        - clerkAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation declined
        "401":
          description: Unauthorized
        "404":
          description: Invite not found

  /groups/{groupId}/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all active categories for a group
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerCategory"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a custom prayer category (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerCategory"
        "401":
          description: Unauthorized
        "403":
          description: Admin role required

  /groups/{groupId}/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin only)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerCategory"
        "401":
          description: Unauthorized
        "403":
          description: Admin role required
        "404":
          description: Category not found

  /groups/{groupId}/requests:
    get:
      operationId: listPrayerRequests
      tags: [prayers]
      summary: List prayer requests for a group
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: urgency
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of prayer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerRequestSummary"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
    post:
      operationId: createPrayerRequest
      tags: [prayers]
      summary: Create a new prayer request
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerRequestInput"
      responses:
        "201":
          description: Prayer request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequestDetail"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/requests/{requestId}:
    get:
      operationId: getPrayerRequest
      tags: [prayers]
      summary: Get prayer request detail
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Prayer request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequestDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Prayer request not found
    patch:
      operationId: updatePrayerRequest
      tags: [prayers]
      summary: Update a prayer request (author or admin/moderator)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerRequestPatch"
      responses:
        "200":
          description: Prayer request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequestDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Prayer request not found
    delete:
      operationId: deletePrayerRequest
      tags: [prayers]
      summary: Delete a prayer request (author or admin)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Prayer request deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Prayer request not found

  /groups/{groupId}/requests/{requestId}/commit:
    post:
      operationId: toggleCommitment
      tags: [prayers]
      summary: Toggle "I am praying" commitment for a prayer request
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Commitment toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitmentStatus"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/requests/{requestId}/comments:
    get:
      operationId: listComments
      tags: [prayers]
      summary: List comments on a prayer request
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerCommentItem"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
    post:
      operationId: addComment
      tags: [prayers]
      summary: Add a comment to a prayer request
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerCommentItem"
        "400":
          description: Comments disabled for this request
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/requests/{requestId}/comments/{commentId}:
    delete:
      operationId: deleteComment
      tags: [prayers]
      summary: Delete a comment (own comment or admin/moderator)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Comment deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Comment not found

  /groups/{groupId}/requests/{requestId}/updates:
    post:
      operationId: addPrayerUpdate
      tags: [prayers]
      summary: Add an update to a prayer request (with optional status transition)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerUpdateInput"
      responses:
        "201":
          description: Update added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequestDetail"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Prayer request not found

  /groups/{groupId}/sessions:
    post:
      operationId: startPrayerSession
      tags: [sessions]
      summary: Start a new Prayer Mode session
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerSessionInput"
      responses:
        "201":
          description: Session started with filtered request list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerSessionDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

  /groups/{groupId}/sessions/{sessionId}/mark-prayed:
    post:
      operationId: markPrayed
      tags: [sessions]
      summary: Mark a request as prayed within a session
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionMarkInput"
      responses:
        "200":
          description: Item marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionMarkResult"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Session or request not found

  /groups/{groupId}/sessions/{sessionId}/complete:
    post:
      operationId: completePrayerSession
      tags: [sessions]
      summary: Complete a Prayer Mode session and get summary
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session completed with summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Session not found

  /groups/{groupId}/sessions/{sessionId}:
    get:
      operationId: getSessionRequests
      tags: [sessions]
      summary: Get session details with current item states
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session detail with latest item states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerSessionDetail"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Session not found

  /groups/{groupId}/sessions/{sessionId}/mark-skipped:
    post:
      operationId: markSkipped
      tags: [sessions]
      summary: Mark a request as skipped within a session
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionMarkInput"
      responses:
        "200":
          description: Item skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSkipResult"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member
        "404":
          description: Session or request not found

  /groups/{groupId}/history:
    get:
      operationId: getPrayerHistory
      tags: [prayers]
      summary: Get prayer history (closed and archived requests)
      security:
        - clerkAuth: []
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: closureReason
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of closed/archived prayer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerRequestSummary"
        "401":
          description: Unauthorized
        "403":
          description: Not a group member

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        fullName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        churchName:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        preferredLanguage:
          type: string
          enum: [en, pt, es]
        primaryAuthProvider:
          type: string
