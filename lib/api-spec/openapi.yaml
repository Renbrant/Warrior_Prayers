openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Warrior Prayers API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: dashboard
    description: Dashboard summary operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /users/me/language:
    patch:
      operationId: updateLanguage
      tags: [users]
      summary: Update user preferred language
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanguageUpdate"
      responses:
        "200":
          description: Language updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats for current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UserProfile:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        fullName:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        churchName:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        profilePhotoUrl:
          type: ["string", "null"]
        preferredLanguage:
          type: string
          enum: [en, pt, es]
        primaryAuthProvider:
          type: string
        emailVerified:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        lastLoginAt:
          type: ["string", "null"]
        isProfileComplete:
          type: boolean
      required:
        - id
        - clerkId
        - email
        - preferredLanguage
        - primaryAuthProvider
        - emailVerified
        - createdAt
        - updatedAt
        - isProfileComplete

    UserProfileUpdate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        phone:
          type: string
        churchName:
          type: string
        city:
          type: string
        profilePhotoUrl:
          type: string
        preferredLanguage:
          type: string
          enum: [en, pt, es]

    LanguageUpdate:
      type: object
      properties:
        language:
          type: string
          enum: [en, pt, es]
      required:
        - language

    DashboardSummary:
      type: object
      properties:
        groupCount:
          type: integer
        activeRequestCount:
          type: integer
        closedRequestCount:
          type: integer
        answeredPrayerCount:
          type: integer
        myCommittedRequestCount:
          type: integer
        pendingInvitationCount:
          type: integer
      required:
        - groupCount
        - activeRequestCount
        - closedRequestCount
        - answeredPrayerCount
        - myCommittedRequestCount
        - pendingInvitationCount
